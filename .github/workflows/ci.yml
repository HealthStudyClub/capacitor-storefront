name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eslint
      - run: npm run prettier -- --check
      - run: npm run build
      - name: Show what would be published
        run: npm pack --dry-run

  ios:
    name: iOS simulator tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: SwiftLint
        run: npm run swiftlint -- lint
      - name: Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E '^\s+iPhone' || true
      - name: Run XCTest on the iOS simulator
        run: ./scripts/test-ios.sh
      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: build/ios/TestResults.xcresult
          if-no-files-found: ignore

  android:
    name: Android emulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies (provides @capacitor/android for Gradle)
        run: npm ci
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build library and unit tests
        run: cd android && ./gradlew build assembleDebugAndroidTest
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./scripts/test-android.sh
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            android/build/reports/androidTests/connected
            android/build/outputs/androidTest-results/connected
          if-no-files-found: ignore
